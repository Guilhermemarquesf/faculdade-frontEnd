<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EA Sports FC</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<header class="bg-dark text-white p-3">
<div class="container d-flex justify-content-between">
<h2>EA SPORTS FC</h2>

<nav>
<a href="#" class="text-white me-3">Home</a>
<a href="#sobre" class="text-white">Sobre</a>
</nav>
</div>
</header>

<main class="container mt-4">

<h2>Jogadores em destaque</h2>

<div id="carouselExample" class="carousel slide">
<div class="carousel-inner" id="carousel"></div>

<button class="carousel-control-prev" type="button"
data-bs-target="#carouselExample"
data-bs-slide="prev">

<span class="carousel-control-prev-icon"></span>

</button>

<button class="carousel-control-next"
type="button"
data-bs-target="#carouselExample"
data-bs-slide="next">

<span class="carousel-control-next-icon"></span>

</button>

</div>


<section class="mt-5">

<h2>Jogadores</h2>

<div class="row" id="cards"></div>

</section>


<section id="sobre" class="mt-5 mb-5">

<h2>Sobre o autor</h2>

<div class="card p-3">

<h4>Guilherme Ferreira</h4>

<p>
Aluno de Sistemas de Informação da PUC Minas.
Projeto desenvolvido sobre jogadores do EA Sports FC utilizando HTML, CSS, Bootstrap e JavaScript.
</p>

</div>

</section>

</main>

<script src="assets/js/app.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
